name: CasaSemEsforco three-scene quality proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/review-v3.yml'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORT_DISABLE_TELEMETRY: '1'
      GITHUB_STEP_SUMMARY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU renderer and speech
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install 'piper-tts==1.3.0' 'onnxruntime==1.31.0'
      - name: Regression tests
        run: python -m unittest discover -s automation/tests -v
      - name: Three distinct narrated videos and visual comparisons
        run: python automation/preview_batch.py
      - name: Retain review videos and measured evidence for seven days
        uses: actions/upload-artifact@v4
        with:
          name: casasemesforco-v3-review
          path: tmp/review-v3/
          retention-days: 7
          if-no-files-found: error

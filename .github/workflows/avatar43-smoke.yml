name: Avatar 4.3 isolated CPU experiment
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/avatar43-smoke.yml'
      - 'automation/avatar43_smoke.py'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Prepare experiment evidence
        run: |
          mkdir -p avatar43-output
          echo '{"stage":"dependency_setup","inference_executed":false,"avatar_video_produced":false}' > avatar43-output/report.json
      - name: Install isolated CPU dependencies
        timeout-minutes: 4
        run: |
          set -eu
          python -m pip install torch==2.2.2 torchvision==0.17.2 torchaudio==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 diffusers==0.24.0 huggingface-hub==0.25.2 transformers==4.38.2 accelerate==0.27.2 omegaconf==2.3.0 einops==0.4.1 moviepy==1.0.3 facenet-pytorch==2.5.0 opencv-python-headless==4.10.0.84 av==12.3.0 imageio-ffmpeg soundfile scipy tqdm ffmpeg-python librosa tiktoken numba
      - name: Attempt three second CPU inference
        timeout-minutes: 5
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
          CUDA_VISIBLE_DEVICES: ''
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: python automation/avatar43_smoke.py
      - name: Preserve evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avatar43-cpu-evidence
          path: |
            avatar43-output/*.json
            avatar43-output/*.log
            avatar43-output/*.mp4
          if-no-files-found: warn
          retention-days: 7

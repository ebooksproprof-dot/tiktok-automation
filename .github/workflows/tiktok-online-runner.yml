name: TikTok Online Runner

on:
  push:
    branches: [main]
    paths:
      - "automation/tiktok_runner.py"
      - "automation/buffer_runner.py"
      - "automation/readiness.py"
      - "automation/tests/**"
      - ".github/workflows/tiktok-online-runner.yml"
  workflow_dispatch:
    inputs:
      buffer_check_only:
        description: "Check Buffer connection without scheduling or publishing"
        type: boolean
        default: false
  schedule:
    - cron: "7 12,20 * * *" # BRT 09:07/17:07: prepare 10h/18h slots
    - cron: "17 13,14,21,22 * * *" # BRT 10:17/11:17/18:17/19:17: verify publication

permissions:
  contents: write
  issues: write

concurrency:
  group: casasemesforco-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install media validator
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Test publishing safeguards
        env:
          GITHUB_STEP_SUMMARY: "" # Mock evidence must never enter the operational summary.
        run: python -m unittest discover -s automation/tests -v

      - name: Report actionable blockers without exposing credentials
        env:
          MEDIA_STORAGE: release
          PUBLISHING_PROVIDER: ${{ vars.PUBLISHING_PROVIDER || 'buffer' }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID || '6ad14dc2778b240e2f1f7c2f' }}
        run: python automation/readiness.py

      - name: Run existing publication queue
        env:
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_TOKEN_URL: ${{ secrets.TIKTOK_TOKEN_URL }}
          TIKTOK_RUNNER_SHARED_SECRET: ${{ secrets.TIKTOK_RUNNER_SHARED_SECRET }}
          MAX_NEW_POSTS_PER_RUN: "1"
          TIKTOK_VERIFIED_VIDEO_PREFIX: ${{ vars.TIKTOK_VERIFIED_VIDEO_PREFIX }}
          PUBLISHING_PROVIDER: ${{ vars.PUBLISHING_PROVIDER || 'buffer' }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID || '6ad14dc2778b240e2f1f7c2f' }}
          BUFFER_CHECK_ONLY: ${{ inputs.buffer_check_only }}
        run: |
          if [ "$BUFFER_CHECK_ONLY" = "true" ]; then
            python automation/buffer_runner.py --check
          elif [ "$PUBLISHING_PROVIDER" = "buffer" ]; then
            python automation/buffer_runner.py
          elif [ -z "$PUBLISHING_PROVIDER" ] || [ "$PUBLISHING_PROVIDER" = "tiktok" ]; then
            python automation/tiktok_runner.py
          else
            echo "::error::Unknown publication provider"
            exit 2
          fi

      - name: Persist runner state
        if: always()
        run: |
          if git diff --quiet -- automation/state.json; then
            echo "No state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/state.json
          git commit -m "Update TikTok automation state"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Keep one actionable failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python automation/notify_failure.py

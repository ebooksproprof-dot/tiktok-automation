name: TikTok Online Runner

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 13-23 * * *" # BRT 10:07–20:37; scheduling can be delayed by GitHub

permissions:
  contents: write

concurrency:
  group: casasemesforco-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install media validator
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Run TikTok queue
        env:
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_TOKEN_URL: ${{ secrets.TIKTOK_TOKEN_URL }}
          TIKTOK_RUNNER_SHARED_SECRET: ${{ secrets.TIKTOK_RUNNER_SHARED_SECRET }}
          MAX_NEW_POSTS_PER_RUN: "1"
          TIKTOK_VERIFIED_VIDEO_PREFIX: ${{ vars.TIKTOK_VERIFIED_VIDEO_PREFIX }}
        run: python automation/tiktok_runner.py

      - name: Persist runner state
        if: always()
        run: |
          if git diff --quiet -- automation/state.json; then
            echo "No state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/state.json
          git commit -m "Update TikTok automation state"
          git pull --rebase origin main
          git push origin HEAD:main

name: TikTok Online Runner

on:
  # A shared concurrency group can replace pending push runs. Always reconcile
  # once trusted main-branch creation finishes; keep durable-state serialization.
  # AI30 writes its queue through github.token, which does not trigger push runs.
  # Its 09:10 collection also finishes after the 09:07 preparation cron.
  workflow_run:
    workflows: [CasaSemEsforco Daily Video Creation, CasaSemEsforco AI30 Free Collector, CasaSemEsforco 9.1 reviewed recovery proof]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "automation/tiktok_runner.py"
      - "automation/buffer_runner.py"
      - "automation/buffer_quota.py"
      - "automation/queue.json"
      - "automation/readiness.py"
      - "automation/daily_coverage.py"
      - ".github/workflows/tiktok-online-runner.yml"
  workflow_dispatch:
    inputs:
      buffer_check_only:
        description: "Check Buffer connection without scheduling or publishing"
        type: boolean
        default: false
      confirm_post_id:
        description: "Read-only: require real publication evidence for this existing queue ID"
        type: string
        default: ""
  schedule:
    - cron: "7 12,20 * * *" # BRT 09:07/17:07: prepare 10h/18h slots
    - cron: "17 13,14,21,22 * * *" # BRT 10:17/11:17/18:17/19:17: verify publication

permissions:
  contents: write
  issues: write

concurrency:
  group: casasemesforco-state
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 35 # Includes only the first authorized near-term proof wait.

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install media validator
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null || ! test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          fi
          python -m pip install 'Pillow==12.3.0'
          python -m pip install 'playwright==1.51.0'
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then
            python -m playwright install --with-deps chromium
          fi

      - name: Test publishing safeguards
        env:
          GITHUB_STEP_SUMMARY: "" # Mock evidence must never enter the operational summary.
        run: python -m unittest discover -s automation/tests -v

      - name: Report actionable blockers without exposing credentials
        env:
          MEDIA_STORAGE: release
          PUBLISHING_PROVIDER: ${{ vars.PUBLISHING_PROVIDER || 'buffer' }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID || '6ad14dc2778b240e2f1f7c2f' }}
        run: python automation/readiness.py

      - name: Run existing publication queue
        env:
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_TOKEN_URL: ${{ secrets.TIKTOK_TOKEN_URL }}
          TIKTOK_RUNNER_SHARED_SECRET: ${{ secrets.TIKTOK_RUNNER_SHARED_SECRET }}
          MAX_NEW_POSTS_PER_RUN: "1"
          TIKTOK_VERIFIED_VIDEO_PREFIX: ${{ vars.TIKTOK_VERIFIED_VIDEO_PREFIX }}
          PUBLISHING_PROVIDER: ${{ vars.PUBLISHING_PROVIDER || 'buffer' }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID || '6ad14dc2778b240e2f1f7c2f' }}
          BUFFER_CHECK_ONLY: ${{ inputs.buffer_check_only }}
          BUFFER_CONFIRM_POST_ID: ${{ inputs.confirm_post_id }}
          REQUIRE_PUBLIC_VERIFICATION: 'true'
        run: |
          if [ -n "$BUFFER_CONFIRM_POST_ID" ]; then
            python automation/buffer_runner.py --confirm-post "$BUFFER_CONFIRM_POST_ID"
          elif [ "$BUFFER_CHECK_ONLY" = "true" ]; then
            python automation/buffer_runner.py --check
          elif [ "$PUBLISHING_PROVIDER" = "buffer" ]; then
            python automation/buffer_runner.py
          elif [ -z "$PUBLISHING_PROVIDER" ] || [ "$PUBLISHING_PROVIDER" = "tiktok" ]; then
            python automation/tiktok_runner.py
          else
            echo "::error::Unknown publication provider"
            exit 2
          fi

      - name: Refresh read-only approval preview
        if: always()
        continue-on-error: true # Preserve state even if preview generation fails.
        run: python automation/refresh_review44.py

      - name: Confirm explicitly authorized near-term live test without resubmission
        if: ${{ success() && inputs.buffer_check_only != true && inputs.confirm_post_id == '' }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID || '6ad14dc2778b240e2f1f7c2f' }}
          REQUIRE_PUBLIC_VERIFICATION: 'true'
        run: python automation/confirm_near_due.py

      - name: Persist runner state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/state.json
          for path in public/review44.html public/review44.json; do
            if test -f "$path"; then git add "$path"; fi
          done
          if git diff --cached --quiet; then
            echo "No state or preview changes."
            exit 0
          fi
          git commit -m "Update TikTok automation state"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Preserve public playback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-playback-evidence
          path: tmp/public-proof/
          retention-days: 7
          if-no-files-found: ignore

      - name: Check daily delivery after reconciliation and persistence
        if: ${{ !cancelled() && inputs.buffer_check_only != true && inputs.confirm_post_id == '' }}
        run: python automation/daily_coverage.py

      - name: Keep one actionable failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python automation/notify_failure.py

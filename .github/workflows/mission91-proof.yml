name: CasaSemEsforco 9.1 reviewed recovery proof
on:
  workflow_dispatch:
    inputs:
      first_test_soon:
        description: 'First real proof in 15 minutes; recurring 10h/18h unchanged'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: casasemesforco-state
  cancel-in-progress: false
jobs:
  proof:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ORT_DISABLE_TELEMETRY: '1'
      NARRATION_ENGINE: kokoro-female
      CAPTION_STYLE: measured-v51
      MEDIA_STORAGE: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free CPU renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install 'kokoro-onnx==0.6.1' 'onnxruntime==1.31.0' 'Pillow==12.3.0'
      - name: Verify guards
        env:
          GITHUB_STEP_SUMMARY: ''
        run: python -m unittest discover -s automation/tests -v
      - name: Render, validate, preserve and queue exactly one reviewed proof
        env:
          GH_TOKEN: ${{ github.token }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID || '6ad14dc2778b240e2f1f7c2f' }}
          FIRST_TEST_SOON: ${{ inputs.first_test_soon }}
        run: |
          args=()
          if [ "$FIRST_TEST_SOON" = 'true' ]; then args+=(--soon); fi
          python automation/mission91_proof.py --stage "${args[@]}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/queue.json
          git commit -m 'Queue reviewed free-stock recovery proof via existing Buffer runner'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Retain proof and audiovisual output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission91-reviewed-proof
          path: |
            tmp/mission91/
            tmp/daily/release-output/
          retention-days: 7
      - name: Accurate result
        if: always()
        run: echo 'Rendering and QUEUED do not mean PUBLISHED. Confirm through the existing TikTok Online Runner and Buffer API.' >> "$GITHUB_STEP_SUMMARY"

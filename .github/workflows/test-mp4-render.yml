name: Test MP4 cloud render
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-mp4-render.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install verified FFmpeg toolchain
        shell: bash
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
      - name: Render vertical MP4
        shell: bash
        run: |
          set -eu
          mkdir -p output
          ffmpeg -hide_banner -nostdin -loglevel error -f lavfi -i "color=c=0x142c30:s=540x960:r=25:d=5" -f lavfi -i "sine=frequency=440:sample_rate=44100:duration=5" -c:v mpeg4 -q:v 5 -pix_fmt yuv420p -c:a aac -shortest -movflags +faststart -y output/render-test.mp4
          test -s output/render-test.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output/render-test.mp4
      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: casasemesforco-render-test
          path: output/render-test.mp4
          if-no-files-found: error
          retention-days: 3

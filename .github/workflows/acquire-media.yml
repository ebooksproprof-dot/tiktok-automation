name: CasaSemEsforco official media acquisition
on:
  workflow_dispatch:
  push:
    paths:
      - 'automation/media_acquisition.py'
      - 'automation/media_providers.py'
      - 'automation/media_rights.py'
      - 'automation/tests/test_acquisition.py'
      - 'automation/tests/test_media_providers.py'
      - '.github/workflows/acquire-media.yml'
# No daily cron until API authorization and real acquisition are verified.
permissions:
  contents: write
  issues: write
concurrency:
  # Inbox/cache are separate files from publication state. Serialize acquisitions
  # without evicting a pending production job from GitHub's one-slot pending queue.
  group: casasemesforco-media-acquisition
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression tests
        env:
          GITHUB_STEP_SUMMARY: ''
        run: python -m unittest discover -s automation/tests -v
      - name: Report optional API credential presence without exposing values
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python -c "import os; [print(k + '_PRESENT=' + str(bool(os.environ.get(k)))) for k in ('PEXELS_API_KEY', 'PIXABAY_API_KEY')]"
      - name: Install media validator
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Acquire at most two new review candidates
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          MEDIA_PROVIDER_ORDER: ${{ vars.MEDIA_PROVIDER_ORDER || 'pixabay,wikimedia,pexels' }}
        run: python automation/media_acquisition.py
      - name: Preserve provenance, API cache and deduplication history
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for path in automation/media_inbox.json automation/media_search_cache.json; do
            if test -f "$path"; then git add "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Persist official media acquisition evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Retain pending review footage (not publication assets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pending-media-review
          path: tmp/media-review/
          retention-days: 3
          if-no-files-found: ignore
      - name: Keep one actionable acquisition failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python automation/notify_failure.py

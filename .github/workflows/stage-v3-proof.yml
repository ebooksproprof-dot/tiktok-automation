name: Stage reviewed book proof for second daily slot
# Historical 3.0 proof only. Production staging belongs to the official daily
# workflow; keep this one-off workflow inert so it cannot create a second path.
on: workflow_dispatch
permissions:
  contents: write
  actions: read
concurrency:
  group: casasemesforco-state
  cancel-in-progress: false
jobs:
  stage:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: casasemesforco-content-pack-review
          run-id: 39355200660
          github-token: ${{ github.token }}
          path: tmp/cloud-proof
      - name: Validate bytes, upload and independently read back Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python automation/stage_reviewed_preview.py tmp/cloud-proof --post-id casasem-2026-10-20-2 --sha256 f38567677f9914670a55450601c4c1cec6a6981bd429787e18e595152cf8b273 --proof-run-id 39355200660
      - name: Preserve unapproved queue record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/queue.json
          git commit -m 'Stage verified 3.0 cloud proof without publication approval'
          git pull --rebase origin main
          git push origin HEAD:main

name: CasaSemEsforco Daily Video Creation

on:
  push:
    branches: [main]
    paths:
      - "automation/render_daily.py"
      - "automation/content_catalog.py"
      - "automation/catalog_extension.py"
      - "automation/catalog_extension.json"
      - "automation/release_media.py"
      - "automation/media_quality.py"
      - "automation/visual_library.py"
      - "automation/narration.py"
      - "automation/female_narration.py"
      - "automation/scene_plan.py"
      - "automation/composition_style.py"
      - "automation/review_requested.py"
      - "automation/stage_requested_proofs.py"
      - "automation/review_requests.json"
      - ".github/workflows/casasemesforco-daily.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * *" # 08:30 America/Sao_Paulo; slots 10:00 and 18:00

env:
  ORT_DISABLE_TELEMETRY: "1"

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: casasemesforco-state
  cancel-in-progress: false

jobs:
  create-videos:
    # Standard public runner only. Never use larger/paid runners.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free video and speech tools
        id: install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng
          python -m pip install 'piper-tts==1.3.0' 'onnxruntime==1.31.0' 'kokoro-onnx==0.6.1'
      - name: Test publishing safeguards
        id: tests
        env:
          GITHUB_STEP_SUMMARY: "" # Keep mock evidence out of operational summaries.
        run: python -m unittest discover -s automation/tests -v
      - name: Migrate unpublished binaries outside source history
        env:
          GH_TOKEN: ${{ github.token }}
        run: python automation/release_media.py
      - name: Render narrated MP4 with technical validation
        env:
          EDITORIAL_RESERVE_DAYS: "3" # At most two renders/run; never approves future slots.
          NARRATION_ENGINE: kokoro-female
          MEDIA_STORAGE: release
          GH_TOKEN: ${{ github.token }}
        run: python automation/render_daily.py
      - name: Render explicitly requested quality proofs (at most three)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.tests.outcome == 'success' }}
        run: python automation/review_requested.py
      - name: Find explicitly approved cloud proof batch
        id: staging
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: |
          python - <<'PYCODE'
          import json, os
          data = json.load(open('automation/review_requests.json'))
          runs = {str(r['proof_run_id']) for r in data['requests']
                  if r.get('approval') and not r.get('staged_post_id')}
          if len(runs) > 1:
              raise ValueError('Stage one reviewed proof run at a time')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('run_id=' + next(iter(runs), '') + '\n')
          PYCODE
      - name: Recover exact approved proof artifact
        id: recovered
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.tests.outcome == 'success' && steps.staging.outcome == 'success' && steps.staging.outputs.run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: requested-quality-proof
          run-id: ${{ steps.staging.outputs.run_id }}
          github-token: ${{ github.token }}
          path: tmp/review-v3/
      - name: Stage at most two hash-approved proofs into free daily slots
        if: ${{ !cancelled() && steps.recovered.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python automation/stage_requested_proofs.py
      - name: Refresh read-only approval preview
        if: always()
        continue-on-error: true # Preview failure must never prevent durable media/state.
        run: python automation/refresh_review44.py
      - name: Persist validated outputs even if a later composition fails
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PYCODE'
          import json, pathlib, subprocess
          paths = ['automation/queue.json', 'automation/review_requests.json']
          paths.extend(p for p in ('public/review44.html', 'public/review44.json') if pathlib.Path(p).exists())
          for entry in json.loads(pathlib.Path('automation/queue.json').read_text())['posts']:
              if entry.get('render_version') != 2 or not entry.get('quality', {}).get('technical_pass'):
                  continue
              media = pathlib.Path('public/rendered/daily') / (entry['id'] + '-v2.mp4')
              if entry.get('media_storage') == 'release':
                  continue # New binaries live in Releases, never source history.
              if media.exists() and media.with_suffix('.json').exists():
                  paths.extend([str(media), str(media.with_suffix('.json'))])
          subprocess.run(['git', 'add', '--', *paths], check=True)
          PYCODE
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Save validated daily videos pending editorial and publishing checks"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Retain requested proof for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: requested-quality-proof
          path: tmp/review-v3/
          retention-days: 7
          if-no-files-found: ignore
      - name: Evidence summary
        if: always()
        run: |
          echo '## Creation only — publication is a separate result' >> "$GITHUB_STEP_SUMMARY"
          echo 'Check queue quality metadata and TikTok runner evidence. No publication is implied by a successful render.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No paid services. Catalog and media storage are bounded; exhaustion fails visibly.' >> "$GITHUB_STEP_SUMMARY"

      - name: Keep one actionable failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python automation/notify_failure.py

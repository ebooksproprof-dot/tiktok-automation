name: CasaSemEsforco Daily Video Creation

on:
  push:
    branches: [main]
    paths:
      - "automation/render_daily.py"
      - "automation/content_catalog.py"
      - "automation/catalog_extension.py"
      - "automation/catalog_extension.json"
      - "automation/release_media.py"
      - "automation/media_quality.py"
      - "automation/visual_library.py"
      - "automation/narration.py"
      - "automation/female_narration.py"
      - "automation/scene_plan.py"
      - "automation/composition_style.py"
      - "automation/caption_layout.py"
      - "automation/review_requested.py"
      - "automation/stage_requested_proofs.py"
      - "automation/review_requests.json"
      - "automation/autonomous_production.py"
      - "automation/semantic_review.py"
      - "automation/source_license.py"
      - ".github/workflows/casasemesforco-daily.yml"
  workflow_dispatch:
    inputs:
      first_live_test_soon:
        description: "One authorized live test soon; normal slots remain 10h/18h"
        type: boolean
        default: false
      production_limit:
        description: "Maximum new ready videos this run (1 or 2)"
        type: choice
        options: ['1', '2']
        default: '2'
  schedule:
    - cron: "20 6,11,19,23 * * *" # BRT 03:20/08:20/16:20/20:20; replenish before/after slots

env:
  ORT_DISABLE_TELEMETRY: "1"
  CAPTION_STYLE: "measured-v51"
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
  HF_HUB_DISABLE_XET: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  SEMANTIC_MODEL_CACHE: ${{ github.workspace }}/tmp/semantic-model-cache

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  create-videos:
    concurrency:
      group: casasemesforco-state
      cancel-in-progress: false
    # Standard public runner only. Never use larger/paid runners.
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check durable stock before installing review weights
        id: demand
        if: github.event_name != 'push'
        run: |
          python - <<'PYCODE'
          import datetime as dt, json, os, sys
          sys.path.insert(0, 'automation')
          from autonomous_production import stock_status
          status = stock_status(json.load(open('automation/queue.json')), json.load(open('automation/state.json')), dt.datetime.now(dt.timezone.utc))
          print(json.dumps(status))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('needed='+str(bool(status['refill_needed'])).lower()+'\n')
          PYCODE
      - name: Install free video and speech tools
        id: install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng
          python -m pip install 'piper-tts==1.3.0' 'onnxruntime==1.31.0' 'kokoro-onnx==0.6.1' 'Pillow==12.3.0'
      - name: Cache pinned CPU review weights (under 2GB, no inference service)
        if: github.event_name != 'push' && steps.demand.outputs.needed == 'true'
        uses: actions/cache@v4
        with:
          path: tmp/semantic-model-cache
          key: semantic-cpu-smolvlm-a7da5b986cb59-v1
      - name: Install CPU-only semantic reviewer
        if: github.event_name != 'push' && steps.demand.outputs.needed == 'true'
        run: |
          python -m pip install 'torch==2.6.0+cpu' 'torchvision==0.21.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.51.3' 'sentencepiece==0.2.0' 'accelerate==1.6.0'
          python -m pip install 'playwright==1.51.0'
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then
            python -m playwright install --with-deps chromium
          fi
      - name: Test publishing safeguards
        id: tests
        env:
          GITHUB_STEP_SUMMARY: "" # Keep mock evidence out of operational summaries.
        run: python -m unittest discover -s automation/tests -v
      - name: Migrate unpublished binaries outside source history
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python automation/release_media.py
      - name: Render narrated MP4 with technical validation
        if: github.event_name != 'push'
        env:
          EDITORIAL_RESERVE_DAYS: "3" # At most two renders/run; never approves future slots.
          NARRATION_ENGINE: kokoro-female
          MEDIA_STORAGE: release
          GH_TOKEN: ${{ github.token }}
          FIRST_LIVE_TEST_SOON: ${{ inputs.first_live_test_soon }}
          PRODUCTION_LIMIT: ${{ inputs.production_limit || '2' }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          args=()
          if [ "$FIRST_LIVE_TEST_SOON" = 'true' ]; then args+=(--soon); fi
          python automation/autonomous_production.py --stage --limit "$PRODUCTION_LIMIT" "${args[@]}"
      - name: Render explicitly requested quality proofs (at most three)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.tests.outcome == 'success' }}
        run: python automation/review_requested.py
      - name: Find explicitly approved cloud proof batch
        id: staging
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: |
          python - <<'PYCODE'
          import json, os
          data = json.load(open('automation/review_requests.json'))
          runs = {str(r['proof_run_id']) for r in data['requests']
                  if r.get('approval') and not r.get('staged_post_id')}
          if len(runs) > 1:
              raise ValueError('Stage one reviewed proof run at a time')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('run_id=' + next(iter(runs), '') + '\n')
          PYCODE
      - name: Recover exact approved proof artifact
        id: recovered
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.tests.outcome == 'success' && steps.staging.outcome == 'success' && steps.staging.outputs.run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: requested-quality-proof
          run-id: ${{ steps.staging.outputs.run_id }}
          github-token: ${{ github.token }}
          path: tmp/review-v3/
      - name: Stage at most two hash-approved proofs into free daily slots
        if: ${{ !cancelled() && steps.recovered.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python automation/stage_requested_proofs.py
      - name: Refresh read-only approval preview
        if: always()
        continue-on-error: true # Preview failure must never prevent durable media/state.
        run: python automation/refresh_review44.py
      - name: Persist validated outputs even if a later composition fails
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PYCODE'
          import json, pathlib, subprocess
          paths = ['automation/queue.json', 'automation/review_requests.json']
          if pathlib.Path('automation/production_state.json').exists():
              paths.append('automation/production_state.json')
          if pathlib.Path('automation/pixabay_license_policy.json').exists():
              paths.append('automation/pixabay_license_policy.json')
          paths.extend(p for p in ('public/review44.html', 'public/review44.json') if pathlib.Path(p).exists())
          for entry in json.loads(pathlib.Path('automation/queue.json').read_text())['posts']:
              if entry.get('render_version') != 2 or not entry.get('quality', {}).get('technical_pass'):
                  continue
              media = pathlib.Path('public/rendered/daily') / (entry['id'] + '-v2.mp4')
              if entry.get('media_storage') == 'release':
                  continue # New binaries live in Releases, never source history.
              if media.exists() and media.with_suffix('.json').exists():
                  paths.extend([str(media), str(media.with_suffix('.json'))])
          subprocess.run(['git', 'add', '--', *paths], check=True)
          PYCODE
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Save validated daily videos pending editorial and publishing checks"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Retain requested proof for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: requested-quality-proof
          path: tmp/review-v3/
          retention-days: 7
          if-no-files-found: ignore
      - name: Retain automatic production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-production-proof
          path: |
            tmp/autonomous-proof/
            tmp/daily/release-output/*.json
            tmp/daily/review-*/*.json
            tmp/daily/review-*/*.jpg
          retention-days: 1 # MP4s are already preserved durably in Releases.
          if-no-files-found: ignore
      - name: Evidence summary
        if: always()
        run: |
          echo '## Creation only — publication is a separate result' >> "$GITHUB_STEP_SUMMARY"
          echo 'Check queue quality metadata and TikTok runner evidence. No publication is implied by a successful render.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No paid services. Catalog and media storage are bounded; exhaustion fails visibly.' >> "$GITHUB_STEP_SUMMARY"

      - name: Keep one actionable failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python automation/notify_failure.py

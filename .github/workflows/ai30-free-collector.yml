name: CasaSemEsforco AI30 Free Collector

on:
  schedule:
    # More than one renewal check after the rolling 24h boundary; never resets quota.
    - cron: '10 6,12,16,22 * * *'
  workflow_dispatch:
    inputs:
      licensed_wan_trial:
        description: 'Collect at most three new explicitly licensed Wan 2.2 5B clips; no publishing in this collection test'
        type: boolean
        default: false
      reconcile_initial_app_failure:
        description: 'Reclassify only the evidenced first Gradio AppError; retain its quota claim and request fingerprint'
        type: boolean
        default: false
      licensed_wan_stage_trial:
        description: 'Review and compose preserved licensed clips; queue the one authorized public AI test through existing Buffer'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai30-free-collector.yml'
      - 'automation/experimental81/wan104*.py'
      - 'automation/experimental81/wan104_components.json'
      - 'automation/experimental81/wan104_source_reviews.json'
      - 'automation/tests/test_wan104*.py'

permissions:
  contents: write
  actions: read

concurrency:
  group: casasemesforco-ai30-collector
  cancel-in-progress: false

env:
  ORT_DISABLE_TELEMETRY: '1'
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
  AI30_MAIN_SCHEDULER_ALLOW: 'true'
  AI_VIDEO_EXPERIMENTAL_ENABLED: 'true'

jobs:
  config-smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify AI30 no-charge controls
        run: |
          python -m unittest discover -s automation/tests -p 'test_wan104*.py' -v
          python automation/experimental81/wan104.py --dry-run
  collect-and-stage:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push' && inputs.licensed_wan_trial != true && inputs.licensed_wan_stage_trial != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      ready: ${{ steps.collect.outputs.ready }}
      collection_status: ${{ steps.collect.outputs.collection_status }}
    steps:
      - name: Checkout tested licensed route without changing preserved A14B inventory
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify offline publishing and budget guards
        id: preflight
        run: |
          python -m unittest discover -s automation/tests -p 'test_wan104*.py' -v
          python automation/experimental81/wan104.py --dry-run
      - name: Install free CPU media tools only (never paid GPU)
        id: install
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=2 update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          python -m pip install --disable-pip-version-check \
            'gradio_client==2.7.2' 'socksio>=1.0,<2'
          command -v ffmpeg && command -v ffprobe
      - name: Attempt bounded ZeroGPU generation and persist every useful clip
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          HF_FREE_TOKEN: ${{ secrets.HF_FREE_TOKEN }}
        run: |
          python automation/experimental81/wan104.py
      - name: Preserve partial generated files even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wan104-generated-source-proof
          path: tmp/wan104/
          retention-days: 3
          if-no-files-found: ignore
      - name: Accurate final run summary
        if: always()
        run: |
          echo '## AI30 free collector' >> "$GITHUB_STEP_SUMMARY"
          echo 'Safety preflight: ${{ steps.preflight.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'CPU dependencies: ${{ steps.install.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'ZeroGPU bounded attempt: ${{ steps.collect.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Collection state: ${{ steps.collect.outputs.collection_status }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Ready for separate CPU assembly: ${{ steps.collect.outputs.ready }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'A green workflow alone does not mean a TikTok video was published.' >> "$GITHUB_STEP_SUMMARY"
          echo 'WAIT_FREE_QUOTA is a deliberate no-inference state. Existing Pixabay replenishment remains independent.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Inspect automation/experimental81/wan104_inventory.json and existing provider state.' >> "$GITHUB_STEP_SUMMARY"
  licensed-collection-trial:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.licensed_wan_trial == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test exact profile, shared quota and durable intent
        run: python -m unittest discover -s automation/tests -p test_wan104.py -v
      - name: Install free client and validator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install 'gradio_client==2.7.2' 'socksio>=1.0,<2'
      - name: Collect licensed model outputs without any publication
        env:
          GH_TOKEN: ${{ github.token }}
          HF_FREE_TOKEN: ${{ secrets.HF_FREE_TOKEN }}
          RECONCILE: ${{ inputs.reconcile_initial_app_failure }}
        run: |
          args=()
          if [ "$RECONCILE" = 'true' ]; then args+=(--reconcile-app-failure); fi
          python automation/experimental81/wan104.py --trial "${args[@]}"
      - name: Preserve partial responses and footage on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wan104-generated-source-proof
          path: tmp/wan104/
          retention-days: 3
          if-no-files-found: ignore
  licensed-stage-trial:
    needs: [collect-and-stage]
    if: always() && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.licensed_wan_stage_trial == true) || (needs.collect-and-stage.result == 'success' && needs.collect-and-stage.outputs.ready == 'true'))
    concurrency:
      group: casasemesforco-state
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SEMANTIC_MODEL_CACHE: ${{ github.workspace }}/tmp/semantic-model-cache
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing CPU compositor and pf_dora
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install 'Pillow==12.3.0' 'kokoro-onnx==0.6.1' 'onnxruntime==1.31.0'
      - uses: actions/cache@v4
        with:
          path: tmp/semantic-model-cache
          key: semantic-cpu-smolvlm-a7da5b986cb59-v1
      - name: Install isolated CPU semantic reviewer (no Gradio client in this environment)
        run: |
          python -m pip install 'torch==2.6.0+cpu' 'torchvision==0.21.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.51.3' 'huggingface-hub==0.36.0' 'accelerate==1.6.0' 'sentencepiece==0.2.0'
      - name: Test preserved publisher and exact new model policy
        env:
          GITHUB_STEP_SUMMARY: ''
        run: python -m unittest discover -s automation/tests -v
      - name: Assemble approved AI sources and hand off to existing publisher
        env:
          GH_TOKEN: ${{ github.token }}
          TRIAL: ${{ inputs.licensed_wan_stage_trial }}
        run: |
          args=()
          if [ "$TRIAL" = 'true' ]; then args+=(--trial); fi
          python automation/experimental81/wan104_finish.py "${args[@]}"
      - name: Keep rendering and review evidence independently of publication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wan104-reviewed-assembly
          # Sources/final MP4 live in Releases. Do not archive the 140MB voice
          # weights or duplicate full videos on every automatic run.
          path: |
            tmp/wan104-finish/**/*.json
            tmp/wan104-finish/**/*.jpg
            tmp/wan104-finish/**/*.srt
          retention-days: 3
          if-no-files-found: ignore

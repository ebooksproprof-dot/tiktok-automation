[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/tiktok/login"
  to = "/.netlify/functions/tiktok-login"
  status = 200
  force = true

[[redirects]]
  from = "/tiktok/callback"
  to = "/.netlify/functions/tiktok-callback"
  status = 200
  force = true

[[redirects]]
  from = "/tiktok/token"
  to = "/.netlify/functions/tiktok-token"
  status = 200
  force = true

[[redirects]]
  from = "/tiktok/health"
  to = "/.netlify/functions/tiktok-health"
  status = 200
  force = true

[[redirects]]
  from = "/tiktok/creator"
  to = "/.netlify/functions/tiktok-creator"
  status = 200
  force = true

[[redirects]]
  from = "/tiktok/publish"
  to = "/.netlify/functions/tiktok-publish"
  status = 200
  force = true

[[redirects]]
  from = "/tiktok/status"
  to = "/.netlify/functions/tiktok-status"
  status = 200
  force = true
